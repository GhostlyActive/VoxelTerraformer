name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # Self-contained, so nobody needs a .NET install to try it
      - name: Publish
        run: dotnet publish Terraformer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: 7z a VoxelTerraformer-${{ matrix.rid }}.zip ./publish/${{ matrix.rid }}/*

      - uses: softprops/action-gh-release@v2
        with:
          files: VoxelTerraformer-${{ matrix.rid }}.zip
