name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # raylib's native library links against X11 and GL even when nothing is drawn, and the
      # engine tests touch it through the day cycle
      - name: Install raylib runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1

      - run: dotnet build Terraformer.sln -c Release

      - run: dotnet test Tests/Tests.csproj -c Release --no-build --verbosity normal
